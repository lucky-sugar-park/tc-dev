# WOW-TC vplc — 가상 PLC 시뮬레이터 설정 (로컬 실행)
#
# 전제 인프라(로컬): MariaDB 3306.
# 비밀값(DB 비밀번호)은 이 파일에 두지 않는다 — 환경 변수 VPLC_DB_PASSWORD 로 주입한다(기본값 없음).
# 로컬 개발: 같은 폴더의 application-local.yml(git 미추적, application-local.yml.example 참고)에 두어도 된다. 실행 jar 에는 넣지 않는다.
# 접속 주소·사용자명도 환경 변수로 바꿀 수 있고, 값이 없으면 아래 로컬 기본값(레거시와 같은 값)을 쓴다.
#
# 레거시 application.properties 에서 뺀 것:
# - actuator(management.*)·Spring Boot Admin client(spring.boot.admin.*) — 의존성을 받을 수 없어 뺐다.
# - spring.mvc.pathmatch.matching-strategy=ant_path_matcher — 기본 PathPattern 도 /api/v1/vplc* 를 그대로 해석한다.
# - server.shutdown.grace-period — Spring Boot 에 없는 속성이라 원래도 효과가 없었다.

server:
  port: 8088
  shutdown: graceful

vplc:
  cors:
    # 화면 출처(쉼표) — 새 tc 화면은 vplc 를 바로 부른다(docs/frontend-design.md F8). 개발 서버 5180, tc 가 서빙하는 화면 8087, 옛 화면 3000
    allowed-origin-patterns: ${VPLC_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5180,http://localhost:8087}
  opcua:
    # 가상 OPC UA 서버(종류 OPC_UA)의 로그인 사용자 — 모든 OPC UA 가상 PLC 가 같이 쓴다(docs/virtual-devices.md).
    # 시험 장비라 기본 비밀번호를 둔다(바꾸려면 VPLC_OPCUA_PASSWORD). tc e2e 가 같은 값을 쓴다
    users:
      - { username: tc-e2e, password: "${VPLC_OPCUA_PASSWORD:tc-e2e-pass}" }

spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: wow-tc-vplc
  datasource:
    url: ${VPLC_DB_URL:jdbc:mariadb://localhost:3306/tc}
    username: ${VPLC_DB_USERNAME:root}
    password: ${VPLC_DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update   # validate, update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
  data:
    redis:
      # framework-core 가 spring-data-redis 를 끌고 오지만 vplc 는 Redis 를 쓰지 않는다 — 리포지터리 스캔을 끈다.
      repositories:
        enabled: false

logging:
  level:
    root: info
