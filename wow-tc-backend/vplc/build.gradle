// vplc — 가상 PLC 시뮬레이터 (실행형, :8088)
//
// 여러 대의 가상 Mitsubishi PLC 를 띄워 MELSEC MC 3E 프레임 요청에 응답한다.
// tc 개발·통합 테스트의 상대 장비로 쓴다.

apply plugin: 'org.springframework.boot'

dependencies {
    // Bean Validation. 사내 Nexus 에 starter 가 없어 Boot 4 의 validation 모듈을 직접 쓴다.
    implementation 'org.springframework.boot:spring-boot-validation'

    // 가상 PLC TCP 서버 (MELSEC MC 프로토콜)
    implementation 'io.netty:netty-transport'
    implementation 'io.netty:netty-codec-base'
    implementation 'io.netty:netty-handler'

    implementation 'org.apache.commons:commons-collections4:4.4'

    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
}

// 로컬 비밀값 파일(application-local.yml)은 실행 jar 에 넣지 않는다 — bootRun·IDE 실행에서만 읽힌다
tasks.named("bootJar") {
    exclude "application-local.yml"
}
