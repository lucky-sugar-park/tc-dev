# WOW-MES Backend — Gradle 빌드 설정
org.gradle.parallel=true
org.gradle.caching=true
# 주의: io.spring.dependency-management 플러그인은 configuration-cache 미호환 → 비활성 유지

# Java toolchain 자동 탐지/다운로드 (로컬에 목표 JDK가 없을 때 프로비저닝)
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
