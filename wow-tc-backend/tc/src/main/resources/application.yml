# Tool Control(tc) 애플리케이션 설정
#
# 전제 인프라(로컬): MariaDB 3306, Redis 6379.
# 비밀값(DB 비밀번호, JWT 서명 키)은 환경 변수로만 준다 — 기본값을 두지 않는다.
#   TC_DB_PASSWORD, TC_JWT_SECRET
# 접속 정보는 환경 변수로 바꿀 수 있고, 없으면 아래 로컬 기본값을 쓴다.
# 로컬 개발: 같은 폴더의 application-local.yml(git 미추적, application-local.yml.example 참고)에 비밀값을 두면
#   IDE 에서 환경 변수 없이 실행할 수 있다. 환경 변수가 있으면 환경 변수가 이긴다. 실행 jar(bootJar)에는 넣지 않는다.

server:
  port: ${TC_SERVER_PORT:8087}
  servlet:
    session:
      timeout: 7200
  # 종료 신호를 받으면 새 요청을 받지 않고 진행 중 요청을 마친 뒤 멈춘다(docs/plc-ha-design.md §5.2).
  # 그 뒤 PlcShutdownLifecycle 이 PLC 연결을 닫는다. 단계별 대기 상한은 spring.lifecycle.timeout-per-shutdown-phase
  shutdown: graceful

spring:
  config:
    import: optional:classpath:application-local.yml
  # 종료 단계마다 기다리는 상한 — 진행 중 PLC 요청의 시간 초과(20초)보다 조금 길게
  lifecycle:
    timeout-per-shutdown-phase: 25s
  application:
    name: wow-tc
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${TC_DB_URL:jdbc:mariadb://localhost:3306/tc}
    username: ${TC_DB_USERNAME:root}
    password: ${TC_DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    show-sql: true
    hibernate:
      # validate, update
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      # framework RedisConfig 가 host/port 로 LettuceConnectionFactory 를 만든다(비밀번호 미사용 — 레거시와 같음)
      host: ${TC_REDIS_HOST:localhost}
      port: ${TC_REDIS_PORT:6379}

logging:
  level:
    root: info

# JWT 서명/만료 (framework JwtConfig 가 요구 — 기본값 없음)
jwt:
  issuer: TC_APP
  secret: ${TC_JWT_SECRET}
  # access 30분(결정 D6) — refresh 로 계속 재발급되므로 사용자 불편은 없다. 바꾸면 재기동이 필요하다
  access-token-validity-ms: 1800000
  refresh-token-validity-ms: 1000000000

# X-Forwarded-For 를 믿을 리버스 프록시 주소(쉼표 목록). 비우면 헤더를 읽지 않고 소켓 상대 주소만 쓴다(framework ClientAddressResolver).
security:
  trusted-proxies: ${TC_TRUSTED_PROXIES:}

app:
  # 인증 없이 받는 경로(framework 0.8.46 PublicPathsProperties) — SecurityConfig 의 permitAll 과 JwtFilter 가 같은 목록을 쓴다.
  # framework 기본값(MES 의 회원가입·이메일 인증·i18n·모바일 경로)은 tc 에 없는 기능이라 tc 목록으로 바꾼다.
  # SPA·정적 자원(/api 밖의 GET)과 SSE 연결은 framework 가 따로 연다. docs/framework-core-0.8.46-changes.md §3
  security:
    public-paths:
      - POST /api/auth/login
      - POST /api/auth/reissue
      - GET /api/health
    # /v3/api-docs 경로용 — tc 의 springdoc 은 /api-docs·/swagger-ui 를 쓰고 이 둘은 /api 밖의 GET 이라 이 값과 관계없이 열린다
    swagger-public: false
    # tc 는 actuator 를 쓰지 않는다
    actuator-public: []
  # framework CorsFilterConfig — 레거시 CorsFilterConfig 와 같은 허용 범위(프론트 개발 서버 localhost:3000, 쿠키 허용)
  cors:
    allowed-origin-patterns: ${TC_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000}
    all-allow-headers: true
    all-allow-methods: true
    allowed-credential: true

springdoc:
  api-docs:
    path: /api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    disable-swagger-default-url: true
    doc-expansion: none
    disable-query-params-without-oauth2: true

#============================================================================
# Tool Control
#============================================================================
tc:
  shutdown:
    # 종료 신호 후 강제 종료(System.exit)까지 기다리는 시간(ms) — ForceShutdownHook
    grace-period: 7000
  # API 클라이언트(타 시스템) 기본값 — 클라이언트별 값(API_CLIENT 표)이 없을 때 쓴다. 이 값은 기동 때 읽는다(바꾸면 재기동).
  # 클라이언트별 한도·허용 범위·키는 관리 API 로 재기동 없이 바꾼다. docs/auth-and-audit-design.md §6
  api-client:
    default-rate-limit-per-sec: 50
    default-max-concurrent: 20
    default-key-days: 365
    max-key-days: 730
    cache-ttl: 30s
    fail-limit-per-minute: 30
    fail-block: 5m
    expiry-notice-days: [30, 7, 1]
    unused-days: 90
    expiry-check-cron: "0 0 8 * * *"
  # 최초 관리자 — USER 표가 비어 있을 때만 쓴다(설계 §3.2). 해시는 BCrypt, 평문 금지
  bootstrap:
    admin-id: ${TC_BOOTSTRAP_ADMIN_ID:}
    admin-password-hash: ${TC_BOOTSTRAP_ADMIN_PASSWORD_HASH:}
  security:
    # 선언(@Requires) 없는 쓰기 API 처리 — AUDIT(기록만) / ENFORCE(403). 운영 중 바꾸기는 PUT /api/v1/security/permission-mode
    permission-mode: AUDIT
    # 기존 JWT 호출자 전환 스위치(설계 §6.10) — 전환이 끝나 false. 옮기지 못한 시스템이 드러나면
    # 재기동 없이 PUT /api/v1/security/dispatch-any-user {"on":true} 로 켠다(Redis 값이 이 설정보다 우선)
    dispatch-any-user: false
    login-throttle:
      max-failures: 5        # 아이디별
      max-ip-failures: 20    # IP별(NAT·프록시 뒤 사용자들이 나눠 쓰므로 크게)
      window: 15m
  # DB 에 저장하는 비밀값(외부 DB 비밀번호) 암호화 키 — Base64 32바이트. 없어도 뜨지만 DB 연결 비밀번호를 저장·사용할 수 없다.
  # 바꾸면 저장된 비밀번호를 다시 입력해야 한다(기동 때 읽음 → 재기동). docs/db-table-delivery.md
  secret-key: ${TC_SECRET_KEY:}
  # 결과 기록용 외부 DB 연결(DB_TABLE 전달). 연결 자체는 /api/v1/db-connections 로 재기동 없이 등록한다.
  db-connection:
    allowed-url-prefixes: [ "jdbc:mariadb:", "jdbc:mysql:" ]
    connect-timeout: 5s
  # 설정 변경 이력(CONFIG_CHANGE_HIST) 보존 — docs/auth-and-audit-design.md §5.4
  config-history:
    retention-days: 365
    purge-cron: "0 30 3 * * *"
  # Quartz 설정(ScheduleConfig 가 이 값을 그대로 Quartz 속성으로 넘긴다).
  # JobStore 의 DataSource 는 ScheduleConfig 가 앱 DataSource 를 넘기므로 Quartz 자체 DataSource 는 두지 않는다.
  quartz:
    properties:
      org.quartz.scheduler.instanceName: TestScheduler
      # SYS_DROP : When to get from system properties
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.scheduler.idleWaitTime: 5000
      org.quartz.threadPool.class: org.quartz.simpl.SimpleThreadPool
      org.quartz.threadPool.threadCount: 4
      # 1 ~ 10
      org.quartz.threadPool.threadPriority: 5
      # org.quartz.jobStore.class 는 지정하지 않는다 — ScheduleConfig 가 앱 DataSource 를 넘기면 SchedulerFactoryBean 이
      # LocalDataSourceJobStore 를 쓴다. JobStoreTX 를 지정하면 Quartz 자체 DataSource 이름을 찾다가 기동이 실패한다.
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      # default value is 60000
      org.quartz.jobStore.misfireThreshold: 60000
      org.quartz.jobStore.useProperties: true
      org.quartz.jobStore.tablePrefix: qrtz_
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 20000

scheduler:
  name:
    default: TestScheduler

plc:
  connection:
    retry:
      count: 10
      interval:
        rate: 1500
        increment: true

oper:
  duplication:
    # default: single / multiple-active / active-standby
    mode: active-standby
